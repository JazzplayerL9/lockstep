name: CI & Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  build-and-test:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: lockstep-linux-x86_64
          - os: windows-latest
            artifact_name: lockstep-windows-x86_64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libx11-dev libxi-dev libgl1-mesa-dev libudev-dev pkg-config

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Check all targets
        run: cargo check --all-targets

      - name: Run unit tests
        run: cargo test --lib

      - name: Build release binaries
        run: cargo build --release

      - name: Package Linux release archive
        if: runner.os == 'Linux' && startsWith(github.ref, 'refs/tags/v')
        run: |
          mkdir -p dist
          cp target/release/lockstep target/release/lockstep-headless README.md LICENSE CHANGELOG.md dist/
          tar -czf lockstep-linux-x86_64.tar.gz -C dist .

      - name: Package Windows release archive
        if: runner.os == 'Windows' && startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target/release/lockstep.exe, target/release/lockstep-headless.exe, README.md, LICENSE, CHANGELOG.md -Destination dist/
          Compress-Archive -Path dist/* -DestinationPath lockstep-windows-x86_64.zip -Force

      - name: Upload release asset
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            lockstep-linux-x86_64.tar.gz
            lockstep-windows-x86_64.zip
