[package]
name = "nes-rt-emu"
version = "0.2.0"
edition = "2024"
default-run = "nes-rt-emu"

[lib]
name = "nes_core"
path = "src/lib.rs"

[[bin]]
name = "nes-rt-emu"
path = "src/main.rs"

[[bin]]
name = "nes-headless"
path = "src/bin/headless.rs"

[dependencies]
flate2 = "1.1"
libc = "0.2"
macroquad = "0.4"

# A cycle-accurate core is far too slow (and too stack-hungry) unoptimized;
# keep `cargo run` usable while retaining debug info.
[profile.dev]
opt-level = 3
debug = 1
overflow-checks = false

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
