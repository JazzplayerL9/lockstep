[package]
name = "lockstep"
version = "0.3.0"
edition = "2024"
description = "Cycle-accurate NES emulator with display-locked, low-latency real-time scheduling"
license = "GPL-3.0-or-later"
authors = ["Zach Jones <jazzplayerl9@gmail.com>"]
readme = "README.md"
keywords = ["nes", "emulator", "famicom", "6502", "realtime"]
categories = ["emulators"]
default-run = "lockstep"

[lib]
name = "lockstep_core"
path = "src/lib.rs"

[[bin]]
name = "lockstep"
path = "src/main.rs"

[[bin]]
name = "lockstep-headless"
path = "src/bin/headless.rs"

[dependencies]
cpal = "0.18.2"
flate2 = "1.1"
libc = "0.2"
macroquad = "0.4"

# A cycle-accurate core is far too slow (and too stack-hungry) unoptimized;
# keep `cargo run` usable while retaining debug info.
[profile.dev]
opt-level = 3
debug = 1
overflow-checks = false

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
